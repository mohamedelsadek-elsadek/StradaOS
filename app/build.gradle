plugins {
    id 'com.android.application'
}

// Firma de release: se toma de variables de entorno (GitHub Actions). Sin ellas, el APK de release
// queda sin firmar (así lo necesita F-Droid, que firma con su propia clave).
def ksPath = System.getenv('STRADAOS_KEYSTORE')

// Edición «Elsadek Car»: ./gradlew assembleRelease -Pelsadek
// Otro paquete (se instala junto a StradaOS), otro nombre, árabe por defecto y sin aviso de versiones de StradaOS.
def elsadek = project.hasProperty('elsadek')
def brandName = elsadek ? 'Elsadek Car' : 'StradaOS'
// número de compilación de Elsadek Car (GitHub Actions: run_number): sube la versión en cada compilación para que
// el botón «Buscar actualizaciones» la detecte
def buildNum = (project.findProperty('buildNum') ?: '0') as Integer

android {
    namespace 'com.stradaos.launcher'
    compileSdk 35

    defaultConfig {
        applicationId elsadek ? 'com.elsadek.car' : 'com.stradaos.launcher'
        // Android 4.1+: el objetivo del proyecto es revivir pantallas de carro antiguas.
        minSdk 16
        // 28 a propósito: mantiene el comportamiento probado en pantallas viejas y nuevas.
        targetSdk 28
        versionCode elsadek ? 1000 + buildNum : 56
        versionName elsadek ? "2.23.0.${buildNum}" : '2.23.0'
        manifestPlaceholders = [appLabel: brandName]
        resValue 'string', 'brand', brandName
        // idioma de una instalación nueva: «auto» = el del sistema
        resValue 'string', 'default_lang', elsadek ? 'ar' : 'auto'
        resValue 'bool', 'updates_on', 'true'
        // de dónde se actualiza la edición (vacío = StradaOS de siempre, ver Updates.init)
        resValue 'string', 'upd_repo', elsadek ? 'mohamedelsadek-elsadek/StradaOS' : ''
        resValue 'string', 'upd_tag', elsadek ? 'elsadek-car' : ''
        resValue 'string', 'upd_apk', elsadek ? 'ElsadekCar.apk' : ''
        // sincronización de viajes con la base de datos de los programas de Mohamed (vacío = sin sincronizar)
        resValue 'string', 'sync_db', elsadek ? 'https://my-app-sync-11ad9-default-rtdb.europe-west1.firebasedatabase.app' : ''
        // مفتاح الويب العام لمشروع Firebase (مش سري): لتسجيل دخول العربية بحسابها
        resValue 'string', 'sync_key', elsadek ? 'AIzaSyAp3pbA-jRE1IhgZiBGsC18s8XOC9lWATs' : ''
        // horario de oración y resumen del viaje en la barra de arriba (Ajustes los puede apagar/encender)
        resValue 'bool', 'extras_on', elsadek ? 'true' : 'false'
    }

    signingConfigs {
        if (ksPath) {
            release {
                storeFile file(ksPath)
                storePassword System.getenv('STRADAOS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('STRADAOS_KEY_ALIAS')
                keyPassword System.getenv('STRADAOS_KEY_PASSWORD')
                enableV1Signing true   // Android 4.x solo entiende la firma v1
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksPath) signingConfig signingConfigs.release
            // Elsadek Car sin la llave de publicación: se firma con la llave de depuración para poder instalarla
            else if (elsadek) signingConfig signingConfigs.debug
        }
        // Versión de prueba: se instala junto a la normal (otro paquete y otro nombre). En GitHub Actions se firma
        // con la misma llave que la normal para que cada prueba nueva se instale encima de la anterior.
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-prueba'
            manifestPlaceholders = [appLabel: brandName + ' Prueba']
            if (ksPath) signingConfig signingConfigs.release
        }
    }

    // Elsadek Car: ícono y logo propios (src/elsadek). Van en los source sets de release/debug, que pisan a main.
    if (elsadek) {
        sourceSets {
            release { res.srcDirs += 'src/elsadek/res'; assets.srcDirs += 'src/elsadek/assets' }
            debug { res.srcDirs += 'src/elsadek/res'; assets.srcDirs += 'src/elsadek/assets' }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // F-Droid: sin el bloque binario de metadatos de dependencias.
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "${elsadek ? 'ElsadekCar' : 'StradaOS'}-${variant.versionName}.apk"
        }
    }
}

// API oculta de Android 4.0–4.3 (IRemoteControlDisplay) para leer la pista en reproducción.
// 1) El stub (src/hiddenapi) se compila solo como referencia: NO entra al APK; en el equipo se usa la clase real.
// 2) RcDisplay (src/legacy), la única clase que la extiende, se compila contra ese stub y se empaqueta en un jar
//    que sí entra al APK. El resto del código la carga por reflexión y nunca ve la API oculta.
def androidJar = files({ android.bootClasspath })
def stubsDir = layout.buildDirectory.dir('intermediates/hiddenapi/stubs')
def legacyDir = layout.buildDirectory.dir('intermediates/hiddenapi/legacy')

def compileStubs = tasks.register('compileHiddenApiStubs', JavaCompile) {
    source = fileTree('src/hiddenapi/java')
    classpath = androidJar
    destinationDirectory = stubsDir
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.compilerArgs += ['-Xlint:-options']
}
def compileLegacy = tasks.register('compileLegacyRc', JavaCompile) {
    dependsOn compileStubs
    source = files('src/legacy/java', 'src/main/java/com/stradaos/launcher/RcCallback.java')
    classpath = androidJar + files(stubsDir)
    destinationDirectory = legacyDir
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.compilerArgs += ['-Xlint:-options']
}
def legacyJar = tasks.register('legacyRcJar', Jar) {
    // solo las clases (antes también entraba previous-compilation-data.bin, el registro de compilación incremental de Gradle)
    from(compileLegacy.flatMap { it.destinationDirectory }) { exclude 'com/stradaos/launcher/RcCallback*' }
    archiveFileName = 'stradaos-legacy-rc.jar'
    destinationDirectory = layout.buildDirectory.dir('intermediates/hiddenapi')
}
tasks.named('preBuild') { dependsOn legacyJar }

dependencies {
    // pantalla dividida (Elsadek Car): permite pedir «ventana libre» al abrir una app (Android 9+)
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
    implementation files(layout.buildDirectory.file('intermediates/hiddenapi/stradaos-legacy-rc.jar')).builtBy(legacyJar)
}
