name: Elsadek Car · capturas

# Compila la versión de prueba de Elsadek Car, saca capturas en un emulador 1280x720 (Android 13)
# y las sube a la rama «capturas-elsadek».
on:
  push:
    branches: [ 'claude/**' ]
    paths: [ 'app/**', '.github/workflows/elsadek-capturas.yml', '.github/scripts/elsadek-capturas.sh' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar Elsadek Car (prueba)
        run: ./gradlew --no-daemon assembleDebug -Pelsadek
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1280x720
          emulator-boot-timeout: 900
          script: bash .github/scripts/elsadek-capturas.sh
      - name: Subir a la rama «capturas-elsadek»
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd capturas
          git init -q -b capturas
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas Elsadek de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:capturas-elsadek
