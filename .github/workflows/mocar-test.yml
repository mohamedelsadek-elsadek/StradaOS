name: MoCar en emuladores

# Instala mocar/Elsadek.apk en emuladores de varias versiones de Android, lo abre y guarda capturas.
on:
  push:
    branches: [ 'claude/**' ]
    paths: [ 'mocar/**', '.github/workflows/mocar-test.yml', '.github/scripts/mocar-test.sh' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 21, arch: x86, target: default }
          - { api: 25, arch: x86, target: default }
          - { api: 29, arch: x86, target: default }
          - { api: 33, arch: x86_64, target: google_apis }
    steps:
      - uses: actions/checkout@v4
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1280x720
          emulator-boot-timeout: 900
          script: bash .github/scripts/mocar-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mocar-api${{ matrix.api }}
          path: out/
